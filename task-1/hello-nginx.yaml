
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
spec:
  replicas: 3

  # Keep existing Pods available during a failed rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: hello-nginx

  template:
    metadata:
      labels:
        app: hello-nginx

    spec:
      shareProcessNamespace: true

      # Spread replicas across the three nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: hello-nginx

      # 1. Init container
      initContainers:
        - name: init-done
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo done

      containers:

        # 2. Main Nginx container
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80

          command:
            - sh
            - -c
            - |
              echo "hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')" \
                > /usr/share/nginx/html/index.html

              exec nginx -g 'daemon off;'

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3

        # 3. Time updater sidecar
        - name: time-updater
          image: nginx:1.27-alpine

          command:
            - sh
            - -c
            - |
              echo "Time updater started"

              while true; do

                PID=""

                for proc in /proc/[0-9]*; do
                  if [ -r "$proc/cmdline" ]; then
                    CMD="$(tr '\000' ' ' < "$proc/cmdline" 2>/dev/null || true)"

                    case "$CMD" in
                      *"nginx: master process"*)
                        PID="${proc##*/}"
                        break
                        ;;
                    esac
                  fi
                done

                if [ -n "$PID" ]; then
                  printf 'hello in MLOPS MENA COMMUNITY : %s\n' \
                    "$(date '+%Y-%m-%d %H:%M:%S')" \
                    > "/proc/$PID/root/usr/share/nginx/html/index.html"

                  echo "Updated timestamp: $(date '+%H:%M:%S')"
                else
                  echo "Waiting for Nginx process..."
                fi

                sleep 5
              done

---
apiVersion: v1
kind: Service
metadata:
  name: hello-nginx-service
spec:
  selector:
    app: hello-nginx

  ports:
    - port: 80
      targetPort: 80

  type: NodePort
